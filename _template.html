<!--
  HOW TO ADD A NEW PAGE
  =====================
  1. Copy this file to pages/<slug>.html  (e.g. pages/claims.html)
  2. Edit <title>, eyebrow, h1, lead, and content.
     - <title> drives the homepage list. You can also add
       <meta name="docs-title" content="..."> to override.
     - <meta name="description"> appears as the subtitle on the home list.
  3. Commit, push. The homepage auto-discovers it — no other edits needed.

  Files starting with "_" (like this one) are ignored by the home list.
-->
